name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests ohne Netzaufrufe
        run: uv run --python 3.12 pytest -q
      - name: Vorschau
        run: uv run python -m installer --dry-run --yes --vault "${{ runner.temp }}"
